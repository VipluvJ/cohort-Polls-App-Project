<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Socket.IO Test</title>
  </head>
  <body>
    <h1>Socket.IO Test</h1>

    <button id="connect">Reconnect</button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();

      socket.on("connect", () => {
        console.log("Connected:", socket.id);

        // Join the room
        socket.emit("join-poll", "6c949490-9871-45db-b2e4-80897da1809f");
      });

      socket.on("room-message", (data) => {
        console.log(data);
      });

      socket.on("pollUpdated", (results) => {
        console.log("Updated Results");

        console.table(results.options);
      });
    </script>
  </body>
</html>
